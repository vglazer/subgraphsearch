# Read the Docs build for the Python API reference (https://subgraphsearch.readthedocs.io).
# The package is built from source, Rust extension included, so each version's reference comes
# from the code at that version rather than from PyPI.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    rust: "latest"

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
      extra_requirements:
        - all

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
