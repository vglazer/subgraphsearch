name: Release

# Runs the CI tests, builds wheels for Linux (glibc and musl), macOS and Windows (x64 and ARM) plus a
# source distribution, then publishes them with PyPI Trusted Publishing (no stored tokens). Releases
# then publish the Rust crates to crates.io, also with Trusted Publishing.
#
# - To release: bump the version in Cargo.toml, then create a release on GitHub
#   (https://github.com/vglazer/subgraphsearch/releases/new) with a new tag `v` followed by that
#   version, e.g. v0.2.2. Publishing the release publishes to PyPI and crates.io.
# - To rehearse: run it by hand (Actions > Release > Run workflow), which publishes to TestPyPI.
#   Each rehearsal publishes its own development release, VERSION.devN with N the run number,
#   since an index accepts each version only once.
#
# One-time setup: add this repository as a trusted publisher on pypi.org and test.pypi.org
# (owner vglazer, repository subgraphsearch, workflow release.yml, environment pypi or testpypi),
# and on crates.io for both subgraphsearch and subgraphsearch-core (same owner, repository and
# workflow, environment cratesio).

on:
  release:
    types: [published]
  # a rehearsal that publishes to TestPyPI
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Check that the release tag matches the package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Cargo.toml has version ${version}, but the release tag is ${TAG}"
            exit 1
          fi

  tests:
    uses: ./.github/workflows/ci.yml

  wheels:
    needs: [check-version, tests]
    name: Wheel (${{ matrix.os }}, ${{ matrix.target }}${{ matrix.manylinux && format(', {0}', matrix.manylinux) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc Linux (most distributions)
          - { os: ubuntu-latest, target: x86_64, manylinux: auto, smoke: true }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto, smoke: false }
          # musl Linux (Alpine, slim Docker images)
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, smoke: false, alpine: true }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2, smoke: false }
          - { os: macos-latest, target: aarch64, smoke: true }
          - { os: macos-latest, target: x86_64, smoke: false }
          - { os: windows-latest, target: x64, smoke: true }
          - { os: windows-11-arm, target: aarch64, smoke: true }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Use PyPI's copy of the README (math as plain text, links to GitHub)
        run: python scripts/make_pypi_readme.py --apply
      - name: Give a TestPyPI rehearsal its own version (VERSION.devRUN)
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/set_dev_version.py ${{ github.run_number }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - name: Smoke-test the wheel
        if: matrix.smoke
        shell: bash
        run: |
          python -m pip install --pre --find-links dist subgraphsearch
          python - <<'PY'
          import subgraphsearch as ss
          g = ss.generate("exponential", 100, 0.6, seed=1, rng="legacy")
          r = ss.search(g, 11, 55, experiments=5, max_moves=100, div_freq=25, div_dur=4, seed=72, rng="legacy")
          assert r.successes == 5, r
          print(ss.__version__, r)
          PY
          subgraphsearch --version
          subgraphsearch generate exponential -n 100 -d 0.6 -s 1 -o g.g6
          subgraphsearch search g.g6 -k 11 -m 55 -q
      - name: Smoke-test the wheel on Alpine
        if: matrix.alpine
        run: |
          docker run --rm -v "$PWD/dist:/dist" python:3.12-alpine sh -c '
            pip install --quiet --pre --find-links /dist subgraphsearch &&
            python -c "import subgraphsearch as ss; g = ss.generate(\"exponential\", 100, 0.6, seed=1, rng=\"legacy\"); r = ss.search(g, 11, 55, experiments=5, max_moves=100, div_freq=25, div_dur=4, seed=72, rng=\"legacy\"); assert r.successes == 5, r; print(ss.__version__, r)" &&
            subgraphsearch --version &&
            subgraphsearch generate exponential -n 100 -d 0.6 -s 1 -o /tmp/g.g6 &&
            subgraphsearch search /tmp/g.g6 -k 11 -m 55 -q'
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist

  sdist:
    name: Source distribution
    needs: [check-version, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Use PyPI's copy of the README (math as plain text, links to GitHub)
        run: python scripts/make_pypi_readme.py --apply
      - name: Give a TestPyPI rehearsal its own version (VERSION.devRUN)
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/set_dev_version.py ${{ github.run_number }}
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    name: Publish to ${{ github.event_name == 'release' && 'PyPI' || 'TestPyPI' }}
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # must match the environment names in the trusted publisher settings on pypi.org and test.pypi.org
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
      url: ${{ github.event_name == 'release' && 'https://pypi.org/project/subgraphsearch/' || 'https://test.pypi.org/project/subgraphsearch/' }}
    permissions:
      id-token: write # for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Check the package metadata
        run: pipx run twine check dist/*
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1

  crates:
    name: Publish to crates.io
    # releases only, once the PyPI release succeeded
    if: github.event_name == 'release'
    needs: [publish]
    runs-on: ubuntu-latest
    environment:
      name: cratesio
    permissions:
      id-token: write # for Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # the library first, then the command; the Python bindings crate is not published
      - run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
