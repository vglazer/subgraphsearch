name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        # the Python bindings are not a default member, so lint them explicitly
        run: |
          cargo clippy --release --all-targets -- -D warnings
          cargo clippy --release -p subgraphsearch-py -- -D warnings
      - name: Tests (unit, doc and golden fixtures from the C programs)
        run: cargo test --release

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Check that the README converts for PyPI
        run: uv run --no-project python scripts/make_pypi_readme.py
      - name: Build the package
        run: uv sync --all-extras
      - name: Build the CLI (for the CLI-to-Python round-trip test)
        run: cargo build --release -p subgraphsearch
      - name: Tests
        # fail on text I/O that relies on the platform's default encoding (cp1252 on Windows)
        run: uv run python -X warn_default_encoding -m pytest -v -W error::EncodingWarning
