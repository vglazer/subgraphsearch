[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "subgraphsearch"
description = "Find induced subgraphs with a given number of vertices and edges, or regular ones, by fast randomized tabu search; with graph generators, standard formats and visualization"
readme = "README.md"
license = "MIT"
authors = [{ name = "Victor Glazer" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["graph", "induced subgraph", "tabu search", "local search", "clique", "regular subgraph", "combinatorics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: Jupyter",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dynamic = ["version"]

[project.scripts]
subgraphsearch = "subgraphsearch._cli:main"

[project.urls]
Homepage = "https://github.com/vglazer/subgraphsearch"
Repository = "https://github.com/vglazer/subgraphsearch"
Issues = "https://github.com/vglazer/subgraphsearch/issues"
Changelog = "https://github.com/vglazer/subgraphsearch/commits/main"

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
interop = ["networkx>=3.1", "scipy>=1.10"]
igraph = ["igraph>=0.11"]
jupyter = ["ipython>=8"]
all = ["subgraphsearch[viz,interop,igraph,jupyter]"]

[dependency-groups]
dev = ["pytest>=8", "maturin>=1.9,<2", "matplotlib>=3.7", "networkx>=3.1", "scipy>=1.10", "igraph>=0.11", "ipython>=8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[tool.maturin]
manifest-path = "crates/subgraphsearch-py/Cargo.toml"
python-source = "python"
module-name = "subgraphsearch._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.uv]
# rebuild the Rust extension whenever Rust sources change
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "crates/**/*.rs" }, { file = "crates/**/Cargo.toml" }]
