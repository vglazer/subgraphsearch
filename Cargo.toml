[workspace]
resolver = "2"
members = ["crates/subgraphsearch-core", "crates/subgraphsearch-cli", "crates/subgraphsearch-py"]
# the Python extension is built by maturin (it needs Python's linker flags), not by plain cargo
default-members = ["crates/subgraphsearch-core", "crates/subgraphsearch-cli"]

[workspace.package]
version = "1.0.5"
edition = "2024"
rust-version = "1.87"
license = "MIT"
authors = ["Victor Glazer"]
repository = "https://github.com/vglazer/subgraphsearch"
homepage = "https://github.com/vglazer/subgraphsearch"

[profile.release]
lto = "thin"
codegen-units = 1
