[package]
name = "subgraphsearch"
description = "Command-line interface for subgraphsearch, including byte-compatible emulation of the original USRA sub_search and ggen programs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "subgraphsearch"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"
serde_json = "1.0.154"
subgraphsearch-core = { version = "0.1.0", path = "../subgraphsearch-core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
