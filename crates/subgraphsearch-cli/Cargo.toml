[package]
name = "subgraphsearch"
description = "Find induced subgraphs with a given number of vertices and edges, or regular ones, from the command line; generate, convert and inspect graphs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["graph", "subgraph", "clique", "tabu-search", "cli"]
categories = ["command-line-utilities", "mathematics", "science"]
# the golden tests read fixtures from the repository root, which the package does not contain
exclude = ["tests/golden.rs"]

[lib]
name = "subgraphsearch"
path = "src/lib.rs"

[[bin]]
name = "subgraphsearch"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"
serde_json = "1.0.154"
subgraphsearch-core = { version = "1.2.1", path = "../subgraphsearch-core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
