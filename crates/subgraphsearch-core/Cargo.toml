[package]
name = "subgraphsearch-core"
description = "Randomized tabu search for induced subgraphs with a given number of vertices and edges, or regular ones, plus graph generators and formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/subgraphsearch-core"
keywords = ["graph", "subgraph", "clique", "tabu-search", "combinatorics"]
categories = ["algorithms", "mathematics", "science"]

[dependencies]
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
