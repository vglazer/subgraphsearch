[package]
name = "subgraphsearch-py"
description = "Python bindings for subgraphsearch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py310"] }
subgraphsearch = { version = "3.0.0", path = "../subgraphsearch-cli" }
subgraphsearch-core = { version = "3.0.0", path = "../subgraphsearch-core" }
